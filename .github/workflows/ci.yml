name: Backend CI

on:
  push:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weeb_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weeb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Construire l'image Docker
        run: docker build --tag weeb-backend-ci:${{ github.sha }} .

      - name: Vérifier la configuration Django
        run: |
          docker run --rm --network host \
            --env SECRET_KEY=ci-only-not-secret \
            --env DEBUG=False \
            --env DB_NAME=weeb_ci \
            --env DB_USER=postgres \
            --env DB_PASSWORD=postgres \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=5432 \
            --env DB_SSLMODE=disable \
            weeb-backend-ci:${{ github.sha }} \
            python manage.py check

      - name: Vérifier les migrations
        run: |
          docker run --rm --network host \
            --env SECRET_KEY=ci-only-not-secret \
            --env DEBUG=False \
            --env DB_NAME=weeb_ci \
            --env DB_USER=postgres \
            --env DB_PASSWORD=postgres \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=5432 \
            --env DB_SSLMODE=disable \
            weeb-backend-ci:${{ github.sha }} \
            python manage.py makemigrations --check --dry-run

      - name: Exécuter les tests Django
        run: |
          docker run --rm --network host \
            --env SECRET_KEY=ci-only-not-secret \
            --env DEBUG=False \
            --env DB_NAME=weeb_ci \
            --env DB_USER=postgres \
            --env DB_PASSWORD=postgres \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=5432 \
            --env DB_SSLMODE=disable \
            weeb-backend-ci:${{ github.sha }} \
            python manage.py test --verbosity 2
